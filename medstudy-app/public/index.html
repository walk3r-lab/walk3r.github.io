<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedStudy Space</title>
<style>
:root{--bg:#08111f;--card:#101d31;--line:#22334d;--text:#eef4ff;--muted:#9fb0c8;--accent:#6ee7b7;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#08111f,#0d1830);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:#062018;font-weight:700}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:var(--danger);color:white}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:55px 0 30px}.hero h1{font-size:clamp(36px,6vw,64px);line-height:1;margin:10px 0}.hero p{color:var(--muted);max-width:700px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:rgba(16,29,49,.9);border:1px solid var(--line);border-radius:16px;padding:18px}.topic{min-height:120px}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.modal>div{width:min(520px,100%);background:#101d31;border:1px solid var(--line);border-radius:18px;padding:24px}.form{display:grid;gap:10px}.form input,.form select{background:#08111f;color:white;border:1px solid var(--line);border-radius:9px;padding:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:13px}.notice{padding:14px;border-radius:12px;background:#12263a;border:1px solid #25435d;margin:15px 0}.video{aspect-ratio:16/9;background:#050a12;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.resource{display:grid;gap:10px}.admin{border-top:1px solid var(--line);margin-top:35px;padding-top:25px}
</style></head><body>
<div class="wrap">
<header class="top"><div class="brand">Med<span>Study</span> Space</div><nav id="nav"></nav></header>
<section class="hero"><span class="pill">Anatomy learning platform</span><h1>Study anatomy. <span style="color:var(--accent)">Understand it.</span></h1><p>Organised anatomy lectures from broad regional and system-based topics. Full lecture access is available to active subscribers.</p><div id="accountActions" class="row"></div></section>
<section id="library"></section>
<section id="admin" class="admin hidden"></section>
</div>
<div id="modal" class="modal hidden"><div><div class="row" style="justify-content:space-between"><h2 id="modalTitle">Sign in</h2><button class="ghost" onclick="closeModal()">Close</button></div><form id="authForm" class="form"><input id="identity" placeholder="Email or phone" required><input id="email" class="hidden" placeholder="Email"><input id="phone" class="hidden" placeholder="Phone"><input id="password" type="password" placeholder="Password (8+ characters)" required><button id="authSubmit">Sign in</button></form><p id="switchAuth" class="muted"></p><div id="authMsg"></div></div></div>
<script>
let me=null,topics=[],resources=[],config={price:600,paymentNumber:'0736501740'},mode='login';
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{cache:'no-store',credentials:'include',headers:{'Content-Type':'application/json'},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function openModal(m){mode=m;$('modal').classList.remove('hidden');$('modalTitle').textContent=m==='login'?'Sign in':'Create account';$('authSubmit').textContent=m==='login'?'Sign in':'Create account';$('identity').classList.toggle('hidden',m!=='login');$('email').classList.toggle('hidden',m==='login');$('phone').classList.toggle('hidden',m==='login');$('switchAuth').innerHTML=m==='login'?'New here? <button class="ghost" onclick="openModal(\'signup\')">Create account</button>':'Already registered? <button class="ghost" onclick="openModal(\'login\')">Sign in</button>'; $('authMsg').textContent=''}
function closeModal(){$('modal').classList.add('hidden')}
$('authForm').onsubmit=async e=>{e.preventDefault();try{let body=mode==='login'?{identity:$('identity').value,password:$('password').value}:{email:$('email').value,phone:$('phone').value,password:$('password').value};let d=await api('/api/auth/'+(mode==='login'?'login':'signup'),{method:'POST',body:JSON.stringify(body)});me=d.user;closeModal();render();}catch(e){$('authMsg').textContent=e.message}};
async function init(){config=await api('/api/config');let m=await api('/api/me');me=m.user;let t=await api('/api/topics');topics=t.topics||[];render()}
function render(){let a=$('accountActions'),n=$('nav');if(!me){a.innerHTML='<button onclick="openModal(\'signup\')">Create account</button><button class="ghost" onclick="openModal(\'login\')">Sign in</button>';n.innerHTML='';showLocked()}else{a.innerHTML='<span class="pill">'+(me.role==='developer'?'Developer access':me.subscription_status)+'</span><button class="ghost" onclick="logout()">Sign out</button>'+(me.role==='developer'?'<button onclick="showAdmin()">Admin</button>':'');n.innerHTML=me.role==='developer'?'<button class="ghost" onclick="showAdmin()">Admin</button>':'';if(me.role==='developer'||me.subscription_status==='active')loadResources();else showPayment()} }
function showLocked(){ $('library').innerHTML='<div class="card"><h2>Lecture library</h2><p class="muted">Sign in and activate your subscription to unlock the lectures.</p><div class="notice"><b>KSh '+config.price+'</b> subscription<br>Pay to <b>'+config.paymentNumber+'</b>, then submit your M-Pesa transaction code.</div><div class="row"><button onclick="openModal(\'signup\')">Create account</button><button class="ghost" onclick="openModal(\'login\')">Sign in</button></div></div><h2 style="margin-top:35px">Topics</h2><div class="grid">'+topics.map(t=>'<div class="card topic"><h3>'+esc(t.name)+'</h3><span class="pill">'+esc(t.group_name)+'</span></div>').join('')+'</div>'}
async function loadResources(){try{let r=await api('/api/resources');resources=r.resources||[];renderLibrary()}catch(e){if(e.message.includes('subscription'))showPayment();else $('library').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function showPayment(){$('library').innerHTML='<div class="card"><h2>Activate your subscription</h2><p>Pay <b>KSh '+config.price+'</b> to <b>'+config.paymentNumber+'</b> using M-Pesa.</p><p class="muted">After payment, enter the transaction code below. Your developer will verify it against the M-Pesa record.</p><form class="form" onsubmit="submitPayment(event)"><input id="mpesa" placeholder="M-Pesa transaction code" required><button>Submit payment code</button></form></div>'}
async function submitPayment(e){e.preventDefault();try{await api('/api/payments',{method:'POST',body:JSON.stringify({mpesaCode:$('mpesa').value})});me.subscription_status='pending';render();$('library').innerHTML='<div class="notice">Payment submitted. Your access will unlock after verification.</div>'}catch(x){alert(x.message)}}
function renderLibrary(){let by={};resources.forEach(r=>(by[r.topic]??=[]).push(r));$('library').innerHTML='<div class="row" style="justify-content:space-between"><h2>Lecture library</h2><span class="pill">'+resources.length+' resources</span></div>'+Object.entries(by).map(([topic,rs])=>'<div><h3>'+esc(topic)+'</h3><div class="grid">'+rs.map(r=>'<div class="card resource"><span class="pill">'+esc(r.kind)+'</span><h3>'+esc(r.title)+'</h3><p class="muted">'+esc(r.subject)+'</p>'+(r.kind==='video'&&r.url?'<div class="video"><iframe src="'+embed(r.url)+'" allowfullscreen loading="lazy"></iframe></div>':'<a href="'+esc(r.url||'#')+'" target="_blank"><button>Open resource</button></a>')+'</div>').join('')+'</div></div>').join('')}
async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;render()}
async function showAdmin(){if(me?.role!=='developer')return;let p=await api('/api/admin/payments');$('admin').classList.remove('hidden');$('admin').innerHTML='<h2>Developer dashboard</h2><div class="card"><h3>Payment approvals</h3>'+((p.payments||[]).length?p.payments.map(x=>'<div class="notice"><b>'+esc(x.app_users?.email||x.app_users?.phone||x.user_id)+'</b> — KSh '+x.amount+' — <b>'+esc(x.mpesa_code)+'</b> — '+esc(x.status)+' '+(x.status==='pending'?'<button onclick="decision(\''+x.id+'\',\'approve\')">Approve</button> <button class="danger" onclick="decision(\''+x.id+'\',\'reject\')">Reject</button>':'')+'</div>').join(''):'<p class="muted">No payment submissions.</p>')+'</div><div class="card" style="margin-top:15px"><h3>Add a broad topic</h3><form class="form" onsubmit="addTopic(event)"><input id="topicName" placeholder="e.g. Pelvis & perineum" required><input id="topicGroup" placeholder="Group, e.g. Regional anatomy"><button>Add topic</button></form></div><div class="card" style="margin-top:15px"><h3>Add a YouTube lecture</h3><form class="form" onsubmit="addResource(event)"><input id="rTitle" placeholder="Lecture title" required><input id="rTopic" placeholder="Topic" required><input id="rUrl" placeholder="YouTube URL" required><button>Add lecture</button></form></div>'}
async function decision(id,a){await api('/api/admin/payments/'+id+'/'+a,{method:'POST'});showAdmin();render()}
async function addTopic(e){e.preventDefault();await api('/api/admin/topics',{method:'POST',body:JSON.stringify({name:$('topicName').value,group_name:$('topicGroup').value})});topics=(await api('/api/topics')).topics;showAdmin()}
async function addResource(e){e.preventDefault();await api('/api/admin/resources',{method:'POST',body:JSON.stringify({kind:'video',title:$('rTitle').value,topic:$('rTopic').value,url:$('rUrl').value})});showAdmin()}
function embed(u){try{let x=new URL(u);if(x.hostname.includes('youtu.be'))return 'https://www.youtube.com/embed/'+x.pathname.slice(1);if(x.hostname.includes('youtube.com')&&x.searchParams.get('v'))return 'https://www.youtube.com/embed/'+x.searchParams.get('v');return u}catch{return u}}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
init();
</script></body></html>
